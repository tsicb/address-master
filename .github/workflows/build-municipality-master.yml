name: Build municipality master

on:
  push:
    paths:
      - ".github/workflows/build-municipality-master.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore municipality master
        run: |
          cat .github/tmp/municipality.part0.b64 \
              .github/tmp/municipality.part1.b64 \
              .github/tmp/municipality.part2.b64 \
              .github/tmp/municipality.part3.b64 \
              .github/tmp/municipality.part4.b64 \
              > /tmp/municipality.b64
          base64 --decode /tmp/municipality.b64 | gzip --decompress > municipality_master.json

      - name: Validate municipality master
        run: |
          python - <<'PY'
          import json
          with open("municipality_master.json", encoding="utf-8") as f:
              data = json.load(f)
          prefs = data.get("prefectures", {})
          munis = data.get("municipalities", {})
          if len(prefs) != 47:
              raise SystemExit(f"Expected 47 prefectures, got {len(prefs)}")
          if len(munis) != 1897:
              raise SystemExit(f"Expected 1897 municipalities, got {len(munis)}")
          if any(len(code) != 5 or not code.isdigit() for code in munis):
              raise SystemExit("Invalid standard region code found")
          print(f"Validated {len(prefs)} prefectures / {len(munis)} municipalities")
          PY

      - name: Commit generated master and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipality_master.json
          git rm .github/tmp/municipality.part0.b64 \
                 .github/tmp/municipality.part1.b64 \
                 .github/tmp/municipality.part2.b64 \
                 .github/tmp/municipality.part3.b64 \
                 .github/tmp/municipality.part4.b64 \
                 .github/workflows/build-municipality-master.yml
          git commit -m "Add municipality master"
          git push
